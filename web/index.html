<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TokenTracer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='1.6'><path d='M5 5.5 L11 9 M5 12 L11 9 M5 12 L11 15 M5 18.5 L11 15 M11 9 L19 12 M11 15 L19 12'/><circle cx='5' cy='5.5' r='2'/><circle cx='5' cy='12' r='2'/><circle cx='5' cy='18.5' r='2'/><circle cx='11' cy='9' r='2'/><circle cx='11' cy='15' r='2'/><circle cx='19' cy='12' r='2'/></svg>">
<link rel="stylesheet" href="/web/app.css">
</head>
<body>

<div class="bar-top">
  <div class="in">
    <div class="nav">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="display:block" aria-hidden="true">
          <path d="M5 5.5 L11 9 M5 12 L11 9 M5 12 L11 15 M5 18.5 L11 15 M11 9 L19 12 M11 15 L19 12" stroke="#ffffff" stroke-width="1.5"/>
          <circle cx="5" cy="5.5" r="2" stroke="#ffffff" stroke-width="1.5" fill="#000000"/>
          <circle cx="5" cy="12" r="2" stroke="#ffffff" stroke-width="1.5" fill="#000000"/>
          <circle cx="5" cy="18.5" r="2" stroke="#ffffff" stroke-width="1.5" fill="#000000"/>
          <circle cx="11" cy="9" r="2" stroke="#ffffff" stroke-width="1.5" fill="#000000"/>
          <circle cx="11" cy="15" r="2" stroke="#ffffff" stroke-width="1.5" fill="#000000"/>
          <circle cx="19" cy="12" r="2" stroke="#ffffff" stroke-width="1.5" fill="#000000"/>
        </svg>
        <div class="word"><b>TOKEN</b><i>TRACER</i></div>
      </div>
      <!-- Two screens: what is running now, and what it has cost over time.
           Real links, so a view is bookmarkable and opens in a new tab. -->
      <div class="views">
        <a href="/dashboard" data-view="overview">Overview</a>
        <a href="/dashboard?view=history" data-view="history">History</a>
      </div>
    </div>
    <div class="hdrs">
      <span id="unp" class="badge unp" style="display:none"></span>
      <!-- Captures are the only thing here that grows without bound, so the
           control that bounds them sits next to what they currently cost. -->
      <div class="keep">
        <span id="capsz">0 B captures</span>
        <label for="ret">keep</label>
        <select id="ret" title="Delete captures older than this. The facts — every number on this page — are never deleted.">
          <option value="off">forever</option>
          <option value="24h">24 hours</option>
          <option value="7d">7 days</option>
          <option value="30d">30 days</option>
        </select>
        <button id="purge" type="button" title="Delete every stored capture now. The facts are kept.">purge</button>
      </div>
      <div class="live"><span class="dot"></span><span id="route">localhost</span></div>
      <span id="hdrstat"></span>
    </div>
  </div>
</div>

<div id="app"></div>
<div id="scrim"></div>
<div id="insp"></div>
<div id="tip"></div>

<script src="/web/app.js"></script>
</body>
</html>
